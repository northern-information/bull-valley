<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Akashic · Bull Valley Shadow Wars</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link
      rel="preload"
      href="/fonts/IBMPlexMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/IBMPlexMono-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/IBMPlexMono-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("/fonts/IBMPlexMono-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: italic;
        font-weight: 400;
        font-display: block;
        src: url("/fonts/IBMPlexMono-Italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("/fonts/IBMPlexMono-SemiBold.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("/fonts/IBMPlexMono-Bold.woff2") format("woff2");
      }
      :root {
        color-scheme: dark;
        --fi-bg: #000000;
        --fi-surface-82: rgb(2 6 23 / 0.82);
        --fi-cyan: #22d3ee;
        --fi-slate: #94a3b8;
        --bv-eggshell: #f0ead6;
        --bv-font: "IBM Plex Mono", ui-monospace, monospace;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--fi-bg);
        color: var(--bv-eggshell);
        font: 12px/1.5 var(--bv-font);
        font-synthesis: none;
        font-variant-numeric: tabular-nums;
      }
      .ak-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .ak-panel {
        position: fixed;
        top: 16px;
        left: 16px;
        max-width: calc(100vw - 32px);
        box-sizing: border-box;
        padding: 12px 14px;
        background: var(--fi-surface-82);
        border: 1px solid var(--fi-cyan);
        box-shadow: 4px 4px 0 rgb(0 0 0 / 0.58);
      }
      .ak-panel h1 {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .ak-row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
      }
      .ak-panel button,
      .ak-panel select {
        font: inherit;
        color: inherit;
        background: #020617;
        border: 1px solid var(--fi-slate);
        padding: 2px 8px;
      }
      .ak-panel select {
        flex: 1;
        min-width: 0;
      }
      .ak-panel :focus-visible {
        outline: 3px solid var(--fi-cyan);
        outline-offset: 1px;
      }
      .ak-toggles {
        display: grid;
        grid-template-columns: repeat(2, auto);
        gap: 2px 14px;
        margin-bottom: 8px;
      }
      .ak-toggles label {
        white-space: nowrap;
      }
      .ak-stats {
        margin: 0;
        white-space: pre;
      }
      .ak-hint {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 12px;
      }
    </style>
  </head>
  <body>
    <canvas class="ak-canvas" aria-hidden="true"></canvas>
    <section class="ak-panel" aria-label="Asset viewer">
      <h1>Akashic</h1>
      <div class="ak-row">
        <button type="button" data-step="-1" aria-label="Previous asset">
          ←
        </button>
        <select name="asset" aria-label="Asset"></select>
        <button type="button" data-step="1" aria-label="Next asset">→</button>
      </div>
      <div class="ak-toggles"></div>
      <p class="ak-stats" aria-live="polite"></p>
    </section>
    <p class="ak-hint">
      drag orbit · scroll zoom · right-drag pan · ←/→ cycle · keys toggle
    </p>
    <script type="module" src="/src/akashic.ts"></script>
  </body>
</html>
