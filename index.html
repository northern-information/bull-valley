<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bull Valley Shadow Wars</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="An extraction adventure RPG set in a hauntological Bull Valley, Illinois. First-person, in the browser, on the real topology of the village."
    />
    <meta name="theme-color" content="#dc2626" />
    <!-- Link previews (Discord, Slack, iMessage, X). og:image must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bull Valley Shadow Wars" />
    <meta property="og:title" content="Bull Valley Shadow Wars" />
    <meta
      property="og:description"
      content="An extraction adventure RPG set in a hauntological Bull Valley, Illinois. First-person, in the browser, on the real topology of the village."
    />
    <meta property="og:url" content="https://bvsw.gay/" />
    <meta property="og:image" content="https://bvsw.gay/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bull Valley Shadow Wars logo: red type on black, with the tagline Extraction-Adventure Hauntological MMORPG"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bull Valley Shadow Wars" />
    <meta
      name="twitter:description"
      content="An extraction adventure RPG set in a hauntological Bull Valley, Illinois. First-person, in the browser, on the real topology of the village."
    />
    <meta name="twitter:image" content="https://bvsw.gay/og.png" />
    <!-- Inter is fetched before the module script, and boot waits for it
         (main.ts fontsReady), so no text paints in a fallback face. -->
    <link
      rel="preload"
      href="/fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("/fonts/InterVariable.woff2") format("woff2");
      }
      :root {
        color-scheme: dark;
        --fi-bg: #000000;
        --fi-surface: #020617;
        --fi-surface-82: rgb(2 6 23 / 0.82);
        --fi-cyan: #22d3ee;
        --fi-green: #4ade80;
        --fi-amber: #fbbf24;
        --fi-gold: #f59e0b;
        --fi-magenta: #e879f9;
        --fi-maroon: #7f1d1d;
        --fi-slate: #94a3b8;
        --fi-paper-light: #f7f4ef;
        --fi-black-shadow: rgb(0 0 0 / 0.58);
        --bv-eggshell: #f0ead6;
        --bv-text-size: 1rem;
        --bv-font: "Inter", system-ui, sans-serif;
        --bv-serif: "Times New Roman", Times, "Liberation Serif", serif;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--fi-bg);
        font-synthesis: none;
      }
    </style>
  </head>
  <body>
    <main id="bv-root"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
