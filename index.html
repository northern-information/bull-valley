<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bull Valley Shadow Wars</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      @font-face {
        font-family: "Small Pixel 7";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/small-pixel-7.ttf") format("truetype");
      }
      :root {
        color-scheme: dark;
        --fi-bg: #000000;
        --fi-surface: #020617;
        --fi-surface-82: rgb(2 6 23 / 0.82);
        --fi-cyan: #22d3ee;
        --fi-green: #4ade80;
        --fi-amber: #fbbf24;
        --fi-gold: #f59e0b;
        --fi-magenta: #e879f9;
        --fi-maroon: #7f1d1d;
        --fi-slate: #94a3b8;
        --fi-paper-light: #f7f4ef;
        --fi-black-shadow: rgb(0 0 0 / 0.58);
        --bv-eggshell: #f0ead6;
        --bv-text-size: 20px;
        --bv-font: "Small Pixel 7", system-ui, sans-serif;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--fi-bg);
        font-synthesis: none;
      }
    </style>
  </head>
  <body>
    <main id="bv-root"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
