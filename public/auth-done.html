<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signed In · Bull Valley Shadow Wars</title>
    <link
      rel="preload"
      href="/fonts/IBMPlexMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/IBMPlexMono-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/IBMPlexMono-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("/fonts/IBMPlexMono-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: italic;
        font-weight: 400;
        font-display: block;
        src: url("/fonts/IBMPlexMono-Italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("/fonts/IBMPlexMono-SemiBold.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("/fonts/IBMPlexMono-Bold.woff2") format("woff2");
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #f0ead6;
        font:
          17px/1.5 "IBM Plex Mono",
          ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <!-- Where a sign-in round trip lands when it was opened as a popup (Link
         Another Account): it tells the game how the round trip went (the
         ?auth= flags, src/account.ts LINK_MESSAGE), then closes, and the
         game reads the account again. Opened any other way, it only says
         so. -->
    <p>Signed in. You can close this window.</p>
    <script>
      if (window.opener) {
        try {
          window.opener.postMessage(
            { type: "bv-auth", search: window.location.search },
            window.location.origin
          )
        } catch {
          // The game reads the account again either way.
        }
        window.close()
      }
    </script>
  </body>
</html>
