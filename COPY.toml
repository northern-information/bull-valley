# The Book of Shadows (src/book.ts, src/bookhud.ts): B opens it. An entry
# stays dark until the account first meets it. Items use their own label
# and blurb ([items.<id>]); the folk and the shadowman use [outfits].

[book]
title = { text = "Book of Shadows", by = "ai" }
places = { text = "Places", by = "ai" }
shadows = { text = "Shadows", by = "ai" }
folk = { text = "Folk", by = "ai" }
items = { text = "Items", by = "ai" }
tally = { text = "{found}/{of}", by = "ai" }
unknown = { text = "???", by = "ai" }
unknown_lore = { text = "Not yet found. Something in the valley is still waiting for you.", by = "ai" }
found_all = { text = "Every page written.", by = "ai" }
toast = { text = "Written in the Book of Shadows", by = "ai" }
toast_many = { text = "{count} new pages", by = "ai" }
toast_hint = { text = "B to read", by = "ai" }

[book.citgo]
name = { text = "The Citgo", by = "ai" }
lore = { text = "Lit all night under the triangle. Shelves of smokes and cans, a clerk who never sleeps, and the one place the shadowmen will not follow you.", by = "ai" }

[book.cabbage-stand]
name = { text = "Bull Valley Cabbage Stand", by = "ai" }
lore = { text = "Set up on the Citgo's lot, honor box and all. No one has ever seen who stocks it.", by = "ai" }

[book.dishes]
name = { text = "The Dish Array", by = "ai" }
lore = { text = "Thirty-six dishes behind the Citgo, red lamps on their horns, turning together on a clock no one set. Listening for something past the valley.", by = "ai" }

[book.wreck]
name = { text = "The Wreck", by = "ai" }
lore = { text = "A green BMW nosed into a tree across from the maze. Still smouldering. The hazards have not stopped blinking since the night it left the road.", by = "ai" }

[book.donut-field]
name = { text = "The Donut Field", by = "ai" }
lore = { text = "Between Lake Avenue and the corn, rutted into rings. Matthew Marx comes here to think.", by = "ai" }

[book.corn-maze]
name = { text = "The Corn Maze", by = "ai" }
lore = { text = "Cut from a hedge maze in an old film, corn over your head the whole way in. It keeps a keeper.", by = "ai" }

[book.maze-heart]
name = { text = "The Heart of the Maze", by = "ai" }
lore = { text = "A ring of berry bushes round a door that opens back onto the gate. You can walk in. The maze decides when you leave.", by = "ai" }

[book.keep]
lore = { text = "A light on the hill to the north. The beacon burns whether anyone is home or not.", by = "ai" }

[book.shadowman]
lore = { text = "They cross the valley round every raider, the same ones for everyone. Close enough, one rushes, draws back, and lunges, and its touch takes a piece of you; the third sends you back to the Citgo with nothing. Hold a beam on one and it comes apart into mist and skulls, and leaves its dimes.", by = "ai" }

[book.spiderling]
name = { text = "Spiderling", by = "ai" }
lore = { text = "Burn a shadow spider and it breaks into a brood of these: small, quick, and straight at whoever is nearest. A touch costs the same as any shadow's. A beam takes them apart in a blink, and each leaves a few dimes.", by = "ai" }

[book.caretaker]
name = { text = "The Caretaker", by = "ai" }
lore = { text = "A hooded shade with a cold lantern who keeps the corn maze. One light does nothing to it. Two, held together, unmake it, and it forms again at the heart.", by = "ai" }

[book.marx]
lore = { text = "Reads at his tailgate by the Citgo, does donuts across the road, and comes when you whistle. Climb into the bed and he will take you out through the valley and home.", by = "ai" }

[book.carlsten]
lore = { text = "Behind the counter at every Citgo at once. Friendly. Knows more about the outages than he says.", by = "ai" }

[book.gron]
lore = { text = "Stands under his own raincloud by the berry bush. He can make you anything you want: a new name, a new body.", by = "ai" }

[book.moab]
lore = { text = "A burning skeleton in a red trench coat, his back to his burning horse, under every Citgo sign. He deals in gold.", by = "ai" }

