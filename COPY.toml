# Every player-facing line in Bull Valley Shadow Wars, in one place.
#
# Each line is a table: the text, and who wrote it.
#
#   by = "ai"     an AI wrote it, and no one has revised or approved it yet
#   by = "tyler"  tyler wrote it or signed off on it
#
# Edit a text freely; flip `by` to "tyler" when a line is yours. {name} is a
# placeholder the game fills in: keep the braces and the name. A text in
# triple quotes keeps its line breaks.
#
# `npm run copy:ai` lists the lines still marked "ai".
#
# Not in this file: the popup landing page
# (public/auth-done.html), the link-preview tags in index.html, the
# provider names (Google, Discord, GitHub), the Akashic dev page, and the
# words painted on packs, cans, medicine and the Citgo signs.

# The intro card, which is also the pause card on Esc (src/hud.ts). The
# note keeps its line breaks.

[intro]
title = { text = "BULL VALLEY SHADOW WARS", by = "tyler" }
note = { text = """
Every night the kingdom crumbles.
Seek Castle Entropy.
Find Empress.
And beware the shadowmen.""", by = "tyler" }
controls_label = { text = "Controls", by = "ai" }
fine = { text = "Requires a keyboard and mouse.", by = "ai" }
raiding_as = { text = "Raiding as", by = "ai" }
account = { text = "Account", by = "ai" }
sign_out = { text = "Sign Out", by = "ai" }

