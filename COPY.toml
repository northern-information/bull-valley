# Matthew Marx, looked at and spoken to (src/npcs.ts): "O, Whistle an' I'll
# Come to Ye, My Lad" by Robert Burns, a stanza each time, into the chat log.
# The texts keep their line breaks.

[marx]
stanza_1 = { text = """
O, whistle, and I'll come to you, my lad;
  O, whistle, and I'll come to you, my lad;
  The' father, and mother, and a' should gae mad,
  O, whistle, and I'll come to you, my lad.""", by = "tyler" }
stanza_2 = { text = """
But warily tent, when you come to court me,
And come na unless the back-yett be a jee;
Syne up the back-stile, and let nae body see,
And come as ye were na comin' to me,
And come as ye were na comin' to me.
  O, whistle, etc.""", by = "tyler" }
stanza_3 = { text = """
At kirk or at market, whene'er ye meet me,
Gang by me as though that ye cared na a flie;
But steal me a blink o' your bonnie black e'e,
Yet look as ye were na lookin' at me,
Yet look as ye were na lookin' at me.
  O, whistle, etc.""", by = "tyler" }
stanza_4 = { text = """
Aye vow and protest that ye care na for me,
And whyles ye may lichtly my beauty a wee;
But court na anither, though jokin' ye be,
For fear that she wyle your fancy frae me,
For fear that she wyle your fancy frae me.
  O, whistle, etc.""", by = "tyler" }

