[book.citgo]
name = { text = "The Citgo", by = "ai" }
lore = { text = "Lit all night under the triangle. Shelves of smokes and cans, a clerk who never sleeps, and the one place the shadowmen will not follow you.", by = "ai" }

[book.cabbage-stand]
name = { text = "Bull Valley Cabbage Stand", by = "ai" }
lore = { text = "Set up on the Citgo's lot, honor box and all. No one has ever seen who stocks it.", by = "ai" }

[book.dishes]
name = { text = "The Dish Array", by = "ai" }
lore = { text = "Thirty-six dishes behind the Citgo, red lamps on their horns, turning together on a clock no one set. Listening for something past the valley.", by = "ai" }

[book.wreck]
name = { text = "The Wreck", by = "ai" }
lore = { text = "A green BMW nosed into a tree across from the maze. Still smouldering. The hazards have not stopped blinking since the night it left the road.", by = "ai" }

[book.strip-mall]
name = { text = "Bull Valley Plaza", by = "ai" }
lore = { text = "Four shops in a row past the Citgo's lot, dark since before anyone can say. The tapes are still on the floor of the Video Vault, and someone keeps candles lit behind the Golden Wok's boards.", by = "ai" }

[book.undercroft]
name = { text = "The Undercroft", by = "ai" }
lore = { text = "Down the ladder under the Video Vault's office: rough-cut rooms older than the plaza, older than the roads. Candles someone keeps lit, a floor of chalk, a wall of skulls, and an altar at the bottom.", by = "ai" }

[book.donut-field]
name = { text = "The Donut Field", by = "ai" }
lore = { text = "Between Lake Avenue and the corn, rutted into rings. Matthew Marx comes here to think.", by = "ai" }

[book.corn-maze]
name = { text = "The Corn Maze", by = "ai" }
lore = { text = "Cut from a hedge maze in an old film, corn over your head the whole way in. It keeps a keeper.", by = "ai" }

[book.maze-heart]
name = { text = "The Heart of the Maze", by = "ai" }
lore = { text = "A ring of berry bushes round a door that opens back onto the gate. You can walk in. The maze decides when you leave.", by = "ai" }

[book.keep]
lore = { text = "A light on the hill to the north. The beacon burns whether anyone is home or not.", by = "ai" }

[book.castle]
name = { text = "Castle Entropy", by = "ai" }
lore = { text = "It hangs over its island with nothing under it but rock and the drop. The moat around it is ten stories of poured concrete. Every night it comes apart and goes back together wrong, and the blue light at its edge never stops turning.", by = "ai" }

[book.shadowman]
lore = { text = "They cross the valley round every raider, the same ones for everyone. Close enough, one rushes, draws back, and lunges, and its touch takes a piece of you; the third sends you back to the Citgo with nothing. Hold a beam on one and it comes apart in a spray of black, and leaves its dimes.", by = "ai" }

[book.spider]
name = { text = "Shadow Spider", by = "ai" }
lore = { text = "A black spider twice a shadowman's height, high on its long legs, eight red eyes burning through the fog. They come up anywhere, and far more often near water. One takes twice as long in a beam to burst, and reaches further when it strikes; it leaves a $20 bill and breaks into a brood of spiderlings.", by = "ai" }

[book.spiderling]
name = { text = "Spiderling", by = "ai" }
lore = { text = "Burn a shadow spider and it breaks into a brood of these: small, quick, and straight at whoever is nearest. A touch costs the same as any shadow's. A beam takes them apart in a blink, and each leaves a few dimes.", by = "ai" }

[book.caretaker]
name = { text = "The Caretaker", by = "ai" }
lore = { text = "A hooded shade with a cold lantern who keeps the corn maze. One light does nothing to it. Two, held together, burn it, and it forms again at the heart.", by = "ai" }

[book.tunnel-shade]
name = { text = "Tunnel Shade", by = "ai" }
lore = { text = "Hunched shapes that keep to the Undercroft's rooms, slower than you but patient. They see in the dark. Your light undoes them, and they come back.", by = "ai" }

[book.warden]
name = { text = "The Warden", by = "ai" }
lore = { text = "Crowned in iron, hung with chain, it keeps the altar at the bottom of the Undercroft and roams the ruins round it, never leaving its chamber. A light held on it long enough throws it into the dark, and it comes back somewhere else among the broken walls; it takes four of those before it bursts.", by = "ai" }

[book.marx]
lore = { text = "Reads at his tailgate by the Citgo, does donuts across the road, and comes when you whistle. Climb into the bed and he will take you out through the valley and home.", by = "ai" }

[book.carlsten]
lore = { text = "Behind the counter at every Citgo at once. Friendly. Knows more about the outages than he says.", by = "ai" }

[book.gron]
lore = { text = "Stands under his own raincloud by the berry bush. He can make you anything you want: a new name, a new body.", by = "ai" }

[book.moab]
lore = { text = "A burning skeleton in a red trench coat, his back to his burning horse, under every Citgo sign. He deals in gold.", by = "ai" }

[book.squatter]
lore = { text = "Sleeps behind the Golden Wok's boards with his candles and his chalk. Takes no cash: he barters for what the Citgo sells, at a little under its price. He has a rose that wants to go somewhere.", by = "ai" }

[book.tyler]
lore = { text = "Sits cross-legged in the back of a red Jeep Wrangler beside Moab, hunched over a laptop with the hatch up, a portable radar dish on the roof cabled down to it. He helps run the Citgo portals. Whatever else he is tuning in, it is not ready yet.", by = "ai" }

[book.jericho]
lore = { text = "Sits beside the payphone on Castle Entropy's rim, twice the height of anyone who comes to him, his cloak pooled round him in tatters. Deep in his hood a small pale mask, and a candle held up to it in one bound hand. A trumpet hangs across his back. The cloak was grey before its embroidery faded into it. He is kind, and he knows a way across, but not an easy one.", by = "ai" }

# Erwin von Dutch, the squatter in Bull Valley Plaza (src/dealer.ts,
# src/dealdialog.ts), and his quest (src/quests.ts).

[dealer]
ramble_1 = { text = "\"Put that wallet away. A Federal Reserve note is an IOU from an empire that owes everybody. I deal in things. Real things.\"", by = "ai" }
ramble_2 = { text = "\"Fiat money is a story the empire tells itself so it can sleep. Cigarettes are a story too, but at least you can smoke them.\"", by = "ai" }
ramble_3 = { text = "\"The dollar's been dead since '71. Nixon killed it on television and nobody came to the funeral. Show me what's in your pack.\"", by = "ai" }
ramble_4 = { text = "\"I do not recognize imperialist currency. Marlboros, beer, a can of something cold, those I recognize. The shadowmen don't take cash either, you'll notice.\"", by = "ai" }
eyebrow = { text = "Barter", by = "ai" }
where = { text = "· The Golden Wok", by = "ai" }
no_fiat = { text = "No Fiat", by = "ai" }
pay_rate = { text = "Counted at {percent}% of Shelf", by = "ai" }
pay_hint = { text = "Cigarettes, drinks, fish, anything a Citgo shelf prices", by = "ai" }
sold_out_button = { text = "Sold Out", by = "ai" }
nothing_to_pay = { text = "\"You've got nothing I want. Come back with smokes, or something to drink.\"", by = "ai" }
bought = { text = "Erwin von Dutch slides you the {item}. \"Pleasure doing business outside the system.\"", by = "ai" }
sold_out = { text = "\"That's all I had today. Come back tomorrow.\"", by = "ai" }
short = { text = "\"That's not enough. I count it at shelf price, less a little for the trouble.\"", by = "ai" }
over = { text = "\"That's too much. I don't make change. Take some back.\"", by = "ai" }
