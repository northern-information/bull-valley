name: Deploy

# Deploys to Cloudflare only after CI passes on a push to main, so a red
# build never ships. workflow_run checks out the default branch by default,
# so the checkout pins the exact commit CI tested. A manual dispatch is
# allowed from main only; the first deploy is one, since workflow_run fires
# only once this file is on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the Worker
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://bvsw.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Bundles the client and the Worker; the plugin writes the deployable
      # wrangler config under dist/ and points `wrangler deploy` at it. The
      # build comes first, so a red one leaves the schema where it was.
      - run: npm run build
      # Migrations only add: a DROP or a RENAME would break the Worker still
      # running while the new one ships, so the deploy refuses one.
      - name: Check the migrations only add
        run: scripts/check-migrations.sh
      # Brings the accounts database up to the schema in migrations/ before
      # the Worker that expects it ships. Runs against the root config:
      # after the build, wrangler is redirected to the generated one under
      # dist/, where the relative migrations_dir would not resolve.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply bull-valley-accounts --remote -c wrangler.jsonc
      # CLOUDFLARE_API_TOKEN is the northern-information organization secret;
      # the account is pinned in wrangler.jsonc.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
      # The redirect from www.bvsw.net and bvsw.gay, a Worker of its own
      # (worker/www.ts). The explicit config skips the redirect to the game's
      # generated config.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy -c wrangler.www.jsonc
