name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's image has the browsers and their system packages, so the
    # job skips `playwright install --with-deps`. That step pulled 32 MB of
    # apt packages and once took 4 minutes on a slow mirror. Keep the tag
    # equal to the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    # The runner draws WebGL in software, so each spec is slow; two jobs run
    # at the same time. --shard cannot split here: it keeps the serial raid
    # group whole and put every test in shard 1. The grep pair covers every
    # spec exactly once, and a new spec lands in "others" by default.
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: raid
            filter: --grep @raid
          - group: others
            filter: --grep-invert @raid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- ${{ matrix.filter }}
      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.group }}
          path: test-results/
          retention-days: 14
