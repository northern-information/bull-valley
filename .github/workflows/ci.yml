name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether a PR touches only the docs (scripts/docs-only.sh). For one that
  # does, the build and the e2e shards report green without running, so a
  # branch rule that requires them never holds it back. A push to main
  # always runs everything, since the deploy follows it.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        name: Is it docs only
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            scripts/docs-only.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo docs-only=false >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  check:
    name: Format, lint, and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      - name: Check the migrations only add
        run: scripts/check-migrations.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit:coverage

  # Skipped for a docs-only PR (a skipped job satisfies a required check).
  # It runs whenever `changes` did not say docs-only, a failed `changes`
  # included, so nothing but a clean docs-only answer ever skips it.
  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The check job already type-checks, so the build here skips `tsc -b`.
      - run: npm run build:only

  # A docs-only PR runs each shard with its steps skipped, never the job:
  # a matrix job skipped whole reports one check under its unexpanded name,
  # and the required `E2E tests (n/3)` checks would wait on it forever.
  e2e:
    name: E2E tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Playwright's image has the browsers and their system packages, so the
    # job skips `playwright install --with-deps`. That step pulled 32 MB of
    # apt packages and once took 4 minutes on a slow mirror. Keep the tag
    # equal to the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    # The runner draws WebGL in software, so each spec is slow; the suite
    # runs as shards at the same time. Playwright's --shard deals the tests
    # out in file order, the same count to each (a serial describe stays
    # whole), so every spec runs exactly once and a new one needs nothing
    # here. The jobs are named by number, not by what they hold, and the
    # e2e-balance job says how evenly they came out (CLAUDE.md, "E2E shards").
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      RUN: ${{ needs.changes.outputs.docs-only != 'true' }}
    steps:
      - name: Docs only, nothing to run
        if: env.RUN != 'true'
        run: echo 'This PR touches only the docs; the shard has nothing to run.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.RUN == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: env.RUN == 'true'
      # scripts/e2e-balance.mjs times the shards by this step's name.
      - name: Run the shard
        if: env.RUN == 'true'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  e2e-balance:
    name: E2E shard balance
    needs: [changes, e2e]
    # Nothing to compare when the shards ran nothing.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Reads this run's job timings; it only warns, so it never holds back
    # the deploy.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100"
          | node scripts/e2e-balance.mjs
